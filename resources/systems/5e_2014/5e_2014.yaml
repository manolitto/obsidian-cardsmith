id: 5e_2014
name: "5E (2014)"

# The stat block of the fifth-edition SRD 5.1 as it is printed:
# parchment, dark-red headings, tapered red rules between the sections,
# an orange bar at the top and the foot, six ability scores in a row.
# TeX Gyre Bonum for the text, Alegreya Sans SC for the section heads,
# Alegreya Sans for the scores, Grenze Bold in small capitals for the
# title — faces that cover the Latin alphabets of Western and Central
# Europe.
# English and German, the German captions those of the German Player's
# Handbook of these rules (Spielerhandbuch, 2nd printing) — and, for the
# regional effects it does not name, of the German Monster Manual. The
# system carries no publisher's mark or wordmark; the
# sample values are invented.
#
# One of two editions of the same game: 5E (2024) is the other. A card
# note moves between them by changing `system:` and nothing else — same
# card types, same properties, same aliases, same value formats
# (`tests/fifth-edition.test.ts` holds both to that). This edition leaves
# unprinted what its books do not print: the initiative, the habitat,
# the treasure, the gear.
#
# Four card types: `creature`, monsters and non-player characters alike,
# the legendary sections where they are set, on a large card — a dense
# block shrinks far before it spills; `spell` and `item` on a poker card;
# `generic`, a name and free text — a class feature, a trait, a feat.
# The back is the label, the picture and the name between the orange
# bars; a d20 stands in for a picture the note does not set.
languages: [en, de]

stylesheet: styles/5e_2014.css

partial-templates:
  statblock: templates/statblock.hbs
  entries: templates/entries.hbs
  rule: templates/rule.hbs

card-size: poker

# ── Shared vocabulary ─────────────────────────────────────────────────
properties:
  name:
    slot: [front-title, back-title]
    description:
      en: "The card's name. Falls back to the file name."

  back-label:
    slot: back-heading
    aliases: [back-caption, rückseite, rueckseite]
    description:
      en: "The label on the back — above the picture or the d20 — `Background`, `Feat`, `NPC`. Without it a creature's type or an item's category, else the card type's own. A feature's origin or a spell's school follows it."

