# ── creature ────────────────────────────────────────────────────────
# Monsters and non-player characters alike: the 2024 stat block, then
# the legendary sections where they are set. A large card.
#
# The properties are the shared vocabulary of both fifth-edition
# systems. `lair-actions` and `regional-effects` are not in the SRD 5.2
# stat block; a note that carries them from 5E (2014) prints them under
# heads of their own.

front-template: templates/creature-front.hbs
back-template: templates/back.hbs

card-size: large

