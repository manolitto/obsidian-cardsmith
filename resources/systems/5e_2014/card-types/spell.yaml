# ── spell ───────────────────────────────────────────────────────────
# A spell as the SRD 5.1 prints it: the level and school in italics
# ("2nd-level evocation", "Evocation cantrip", "(ritual)" after), the
# four lines, the text, "At Higher Levels."
#
# The properties are the shared vocabulary of both fifth-edition
# systems: the level a number, 0 for a cantrip, the school a word in
# English or German, spelt out per language by the glyph tables below —
# "2nd-level evocation" / "Hervorrufung des 2. Grades", "Evocation
# cantrip" / "Zaubertrick der Hervorrufung"; the order of the two words
# is the caption `spell-order-*`. The class
# lists, which this edition does not print, are declared without a place.
#
# The back's top line names the school after the label — `Zauber /
# Hervorrufung` — as the note writes it, so a deck of spells read
# from behind sorts by school; the name stands below the picture.

front-template: templates/spell-front.hbs
back-template: templates/back.hbs

translations:
  en:
    back-label: "Spell"
    ritual: "(ritual)"
    concentration: "Concentration, up to"
    front-casting-time-label: "Casting Time:"
    front-range-label: "Range:"
    front-components-label: "Components:"
    front-duration-label: "Duration:"
    front-higher-levels-label: "At Higher Levels"
    spell-order-leveled: "level-first"
    spell-order-cantrip: "school-first"
  de:
    back-label: "Zauber"
    ritual: "(Ritual)"
    concentration: "Konzentration, bis zu"
    front-casting-time-label: "Zeitaufwand:"
    front-range-label: "Reichweite:"
    front-components-label: "Komponenten:"
    front-duration-label: "Wirkungsdauer:"
    front-higher-levels-label: "Auf höheren Graden"
    spell-order-leveled: "school-first"
    spell-order-cantrip: "level-first"

properties:
  name:
    sample:
      en: "Ember Lance"
      de: "Glutlanze"

  level:
    slot: front-level
    aliases: [spell-level, grad, stufe]
    description:
      en: "The spell's level, 0 to 9; 0 is a cantrip."
      de: "Der Grad des Zaubers, 0 bis 9; 0 ist ein Zaubertrick."
    sample: 2

  school:
    slot: [front-school, front-school-cantrip, back-origin]
    aliases: [school-of-magic, schule]
    description:
      en: "The school of magic — `Evocation`; the German name reads the same."
      de: "Die Schule der Magie — `Hervorrufung`; der englische Name gilt genauso."
    sample:
      en: "Evocation"
      de: "Hervorrufung"

  classes:
    aliases: [spell-lists, klassen]
    description:
      en: "The classes whose spell lists hold it. Printed by 5E (2024); this edition leaves it out."
      de: "Die Klassen, auf deren Zauberliste er steht. Nur 5E (2024) druckt sie; diese Ausgabe lässt sie weg."

  casting-time:
    slot: front-casting-time
    aliases: [castingtime, zeitaufwand]
    description:
      en: "The casting time — `1 action`, `1 bonus action`, `1 minute`."
      de: "Der Zeitaufwand — `1 Aktion`, `1 Bonusaktion`, `1 Minute`."
    sample:
      en: "1 action"
      de: "1 Aktion"

  range:
    slot: front-range
    aliases: [reichweite]
    description:
      en: "The range — `60 feet`, `Self`, `Touch`."
      de: "Die Reichweite — `18 Meter`, `Selbst`, `Berührung`."
    sample:
      en: "60 feet"
      de: "18 Meter"

  components:
    slot: front-components
    aliases: [komponenten]
    description:
      en: "The components — `V, S, M (a pinch of ash)`."
      de: "Die Komponenten — `V, G, M (eine Prise Asche)`."
    sample:
      en: "V, S"
      de: "V, G"

  duration:
    slot: front-duration
    aliases: [wirkungsdauer, dauer]
    description:
      en: "The duration — `Instantaneous`, `1 minute`. With `concentration`, the card prints “Concentration, up to” before it."
      de: "Die Wirkungsdauer — `Unmittelbar`, `1 Minute`. Mit `concentration` steht „Konzentration, bis zu“ davor."
    sample:
      en: "Instantaneous"
      de: "Unmittelbar"

  ritual:
    slot: front-ritual
    description:
      en: "`true` for a spell that can be cast as a ritual: “(ritual)” after the school."
      de: "`true` für einen Zauber, der als Ritual gewirkt werden kann: „(Ritual)“ nach der Schule."

  concentration:
    slot: front-concentration
    aliases: [konzentration]
    description:
      en: "`true` for a spell that requires concentration."
      de: "`true` für einen Zauber, der Konzentration erfordert."

  description:
    slot: front-description
    description:
      en: "What the spell does — markdown, paragraphs and lists."
      de: "Was der Zauber bewirkt — Markdown, Absätze und Listen."
    sample:
      en: "A lance of white-hot ash strikes one creature you can see within range. Make a ranged spell attack. On a hit, the target takes 3d8 fire damage and sheds dim light until the start of your next turn."
      de: "Eine Lanze aus weißglühender Asche trifft eine Kreatur in Reichweite, die du sehen kannst. Führe einen Fernkampf-Zauberangriff aus. Bei einem Treffer erleidet das Ziel 3W8 Feuerschaden und spendet bis zum Beginn deines nächsten Zuges dämmriges Licht."

  body:
    slot: front-description

  higher-levels:
    slot: front-higher-levels
    aliases: [at-higher-levels, higher-level-slot, höhere-grade, hoehere-grade]
    description:
      en: "What a higher spell slot adds, after “At Higher Levels.” in bold italics."
      de: "Was ein Zauberplatz höheren Grades hinzufügt, nach „Auf höheren Graden.“ fett-kursiv."
    sample:
      en: "When you cast this spell using a spell slot of 3rd level or higher, the damage increases by 1d8 for each slot level above 2nd."
      de: "Wenn du diesen Zauber mit einem Zauberplatz des 3. Grades oder höher wirkst, steigt der Schaden für jeden Grad über dem 2. um 1W8."

  cantrip-upgrade:
    slot: front-cantrip-upgrade
    aliases: [cantrip-scaling, zaubertrick-verbesserung]
    description:
      en: "How a cantrip grows with the caster's level — a paragraph after the text."
      de: "Wie ein Zaubertrick mit der Stufe des Wirkers wächst — ein Absatz nach dem Text."

  image:
    slot: back-image
    aliases: [bild]
    description:
      en: "A picture for the back — a wikilink to a picture in the vault. Without one the back shows a d20."
      de: "Ein Bild für die Rückseite — ein Wikilink auf ein Bild im Vault. Ohne Bild zeigt die Rückseite einen W20."
    sample: "[[Ember-Lance.jpg]]"

