# The baseline — the seed every system grows from.
#
# Two things live here, and a loader reads them as two layers:
#
#   properties:   the definition cascade's seed. The properties every card
#                 has, whatever its system, so that a system — bundled or a
#                 user's own — inherits them with their aliases and their
#                 documentation instead of starting empty.
#
#   everything else — the lowest layer of the two setting chains. Card
#                 settings (`card-size`, `overflow-mode`, …) are resolved once
#                 per card through system, card type, deck and note; deck
#                 settings (`paper-size`, `page-margin`, …) once per deck.
#                 A system's root document and a deck block are the next
#                 layers up and may override any of them.
#
# Nothing here names a file. A reader's preference — the preview height, whether
# textures print — is a plugin setting, not a value in this file.

# ── Properties ───────────────────────────────────────────────────────
#
# An alias is a second name a note may write for the same value. Aliases add
# up across layers — a system appends its own spellings and never loses these.

properties:
  name:
    aliases: [display-name, title, label]
  description:
    aliases: [desc, summary]
  image:
    aliases: [picture, portrait, img, photo]
  tags:
    aliases: [tag]

  # The note's own text. What stands before the first `##` heading is the
  # property `body`; every `##` heading below it is a property named after the
  # heading in kebab-case (`## Vorderseite` → `vorderseite`). Both hold raw
  # markdown and sit under everything else a note says — frontmatter, the
  # block's `data:`, a table row — so a `## Beschreibung` section is a long
  # `description` written where long text belongs. A card type binds them
  # with `slot:` like any other value; this entry only says what `body` is.
  body:
    description:
      de: "Der Notiztext vor der ersten `##`-Überschrift, als Markdown. Wird nicht im Block geschrieben, sondern ist die Notiz selbst; ein Kartentyp bindet ihn an einen Platz auf der Karte."
      en: "The note's text before the first `##` heading, as markdown. Not written in the block — it is the note itself; a card type binds it to a place on the card."

  # Empty boxes to tick off with a pen — arrows, charges, uses per rest.
  # The one baseline property with a place of its own: every front shows it,
  # at the end of its body unless a template puts `{{slot "front-tracker"
  # tracker=true}}` somewhere else. No sample here, so a sample card of a
  # system that has no use for boxes does not grow them; a card type that
  # does gives one.
  tracker:
    aliases: [boxes, checkboxes, tick-boxes, kästchen, kaestchen, ankreuzkästchen, ankreuzfelder, abstreichen]
    slot: front-tracker
    description:
      de: "Leere Kästchen zum Abstreichen mit dem Stift. Eine Zahl (`20`), eine Reihe mit Beschriftung (`{ count: 20, label: Pfeile }`) oder eine Liste solcher Reihen. `group` (Standard 5) fasst so viele Kästchen zu einer Gruppe zusammen."
      en: "Empty boxes to tick off with a pen. A number (`20`), a labelled row (`{ count: 20, label: Arrows }`) or a list of such rows. `group` (default 5) sets how many boxes stand together."

  # A card that comes from a roll table — a critical hit, a mishap, a treasure,
  # an encounter — carries the result it is listed under. `roll` is the display
  # form; `roll-min` and `roll-max` are the integer bounds a deck sorts, filters
  # and expands by. German aliases are part of the baseline so a German system
  # does not have to restate them.
  roll:
    aliases: [dice-roll, würfelwurf, wurf, tabellenwurf, würfelergebnis]
    description:
      de: "Würfelwurf (Bereich oder Einzelwert), unter dem diese Karte in der Quelltabelle erscheint. Anzeigeform — z. B. „01“, „23–24“, „98–100“. Für numerische Abfragen und Sortierung siehe `roll-min` und `roll-max`."
      en: "Die-roll result (range or single value) under which this card appears in the source table. Display form — e.g. \"01\", \"23–24\", \"98–100\". For numeric queries and sorting see `roll-min` and `roll-max`."
    sample:
      de: "01"
      en: "01"

  roll-min:
    aliases: [roll-from, wurf-min, wurf-von]
    description:
      de: "Untere Grenze des Würfelwurf-Bereichs als Ganzzahl. Bei Einzelwürfen `roll-min == roll-max`."
      en: "Lower bound of the roll range as an integer. For single-value rolls, `roll-min == roll-max`."
    sample:
      de: 1
      en: 1

  roll-max:
    aliases: [roll-to, wurf-max, wurf-bis]
    description:
      de: "Obere Grenze des Würfelwurf-Bereichs als Ganzzahl."
      en: "Upper bound of the roll range as an integer."
    sample:
      de: 1
      en: 1

# ── Card settings ────────────────────────────────────────────────────

# Physical geometry. A preset name or `63 x 88 mm`, either followed by
# `landscape` for the wide way round: `poker landscape` is 88 by 63.
card-size: poker

# What a card does when its content will not fit even at the smallest type
# size the stylesheet allows. `none` clips; `extra-cards` continues on further
# front/back pairs; `back-then-cards` fills the back first. A design decides —
# a system or card type sets this; a deck or note may override it for itself.
overflow-mode: none

# The ways a card may be laid out, and how the winner is chosen. One candidate
# that accepts any parity of front faces is the layout engine's trivial case:
# it always commits. A layer declaring its own `layouts:` replaces this list.
layouts:
  - { name: default, front-face-count: any, fallback: true }
layout-decision:
  order:
    - { metric: printed-cards, direction: minimize }
  tie-break: declaration-order

# Which face the in-note preview shows. Deck output always renders both.
side: both

# Print one card per integer in the roll range. A roll-table card type says
# `true` once; every other card is printed as it is.
expand-by-roll: false

# Whether a note that runs onto several cards prints them side by side,
# uncut, as one piece folded instead of cut apart — and which face goes
# where. The faces count in reading order: the first card's front 1, its
# back 2, the second card's front 3, and on. `strip`: page 1 on the left,
# its fold on the right — 1, 2, 3 across the front, 4, 5, 6 across the back;
# with no gap and nothing folded, a wide card of columns. `cover`: page 1 on
# the right, its fold on the left — 5, 6, 1 across the front, 2, 3, 4 across
# the back, so that folded inwards page 1 is a cover with the last page
# behind it. Both keep the whole note in one piece; one wider than the paper
# stops the export. `booklet`: sheets of two cards, nested and folded down
# the middle like a printer's booklet. `off` cuts every card out. A deck sets
# it for every card it holds, a note for itself.
fold: off

# Where the card folds (`fold:` above), the strip between two
# panels — a hinge — rather than a crease. The fields merge across layers, so
# a deck can change one alone:
#   gap        millimetres between two panels; 0 folds along a crease. Cut out
#              and laminated, 1.5 folds well; left standing on paper that is
#              not laminated, 0.5 is plenty.
#   outer-gap  millimetres of a `cover`'s outer hinge, which goes round three
#              panels or more folded inside it. Absent: `gap`.
#   color      the strip's colour, any CSS colour; white, the paper's own,
#              unless a system, card type, deck or note says otherwise.
#   sides      `front`, the side a knife works from, or `both`, behind itself
#              on the back of the sheet as well.
#   cut-out    `true` for a laminated card: the strip is cut out and the film
#              seals in the slot, cut marks either side. `false` keeps it as
#              the fold's spine, with a fold mark at each edge.
hinge:
  gap: 0
  color: "#ffffff"
  sides: front
  cut-out: false

# ── Deck settings ────────────────────────────────────────────────────

# Paper the deck is imposed on. A sheet (`A4`, `Letter`, …), a card size
# (`poker`, `tarot`, … — one card per page, for a screen) or `210 x 297 mm`;
# a preset may be followed by `portrait` or `landscape`, and without the
# word the deck picks whichever way holds more cards. Dimensions are as
# written.
paper-size: A4

# Blank space around the card grid, in millimetres, on all four sides. The
# margin yields where the paper is too small for it; the card never does.
page-margin: 10

# Which edge of the paper is the binding when printing duplex, so that fronts
# and backs align after the flip. `long-edge` or `short-edge`.
duplex-flip: long-edge

# Alignment marks at each card's outer corners; a page that holds a single
# card gets none. The fields merge across layers, so a deck can change the
# colour without restating the geometry.
cut-marks:
  enabled: true
  length: 3 # mm
  margin: 0 # mm between the card corner and the mark; 0 makes the four arms meet at the corner
  color: "#aaaaaa"
  weight: 0.25 # mm

# When a deck collects a folder, include its subfolders.
folder-recursive: true
