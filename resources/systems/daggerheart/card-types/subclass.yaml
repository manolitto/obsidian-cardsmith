# A subclass card: one of the three a subclass has — foundation,
# specialization, mastery. The class rides in the ribbon, the subclass is
# the title, the stage of the card is the line under it, and the
# spellcast trait — when the subclass has one — is the bold line below.
# Class, stage and trait may be written in English or German.
front-template: templates/front.hbs
back-template: templates/back.hbs

translations:
  en:
    back-label: "Subclass"
    front-meta-label: "Spellcast Trait:"
  de:
    back-label: "Subklasse"
    front-meta-label: "Zauber-Attribut:"

properties:
  name:
    sample:
      en: "Troubadour"
      de: "Minnesang"

  class:
    slot: front-ribbon
    aliases: [klasse]
    description:
      en: "The class — Bard, Druid, Guardian, Ranger, Rogue, Seraph, Sorcerer, Warrior or Wizard; German names work too. The word in the ribbon."
      de: "Die Klasse — Barde*in, Druide*in, Wächter*in, Waldläufer*in, Schurke*in, Seraph, Zauberer*in, Krieger*in oder Magier*in; englische Namen gehen auch. Das Wort im Band."
    sample:
      en: "Bard"
      de: "Barde*in"

  stage:
    slot: front-subtitle
    aliases: [card, subclass-card, karte, kartenstufe]
    description:
      en: "Which of the subclass's three cards this is: Foundation, Specialization or Mastery."
      de: "Welche der drei Karten der Subklasse das ist: Basis, Spezialisierung oder Meisterschaft."
    sample:
      en: "Foundation"
      de: "Basis"

  spellcast-trait:
    slot: front-meta
    aliases: [spellcast, trait, zauber-attribut, zauberattribut, attribut]
    description:
      en: "The subclass's spellcast trait — Agility, Strength, Finesse, Instinct, Presence or Knowledge. Leave it out for a subclass without one."
      de: "Das Zauber-Attribut der Subklasse — Agilität, Stärke, Geschick, Instinkt, Präsenz oder Wissen. Weglassen bei einer Subklasse ohne."
    sample:
      en: "Presence"
      de: "Präsenz"

  description:
    sample:
      en: "**Gifted Performer:** You can play three different types of songs, once each per long rest; describe how you perform for others to gain the listed benefit:\n\n- **Relaxing Song:** You and all allies within Close range clear a Hit Point.\n- **Epic Song:** Make a target within Close range temporarily Vulnerable.\n- **Heartbreaking Song:** You and all allies within Close range gain a Hope."
      de: "**Bühnentalent:** Du kannst drei verschiedene Arten von Liedern spielen, jede einmal pro langer Rast; beschreibe, wie du vor anderen auftrittst, um den genannten Vorteil zu erhalten:\n\n- **Beruhigendes Lied:** Du und alle Verbündeten in kurzer Distanz löschen 1 TP.\n- **Episches Lied:** Ein Ziel in kurzer Distanz wird vorübergehend Verwundbar.\n- **Herzzerreißendes Lied:** Du und alle Verbündeten in kurzer Distanz erhalten 1 Hoffnung."

