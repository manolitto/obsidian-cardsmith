# A community card: the name, a line on where the character grew up, and
# the community feature as the text. The same shape as an ancestry card,
# in its own colour.
front-template: templates/front.hbs
back-template: templates/back.hbs

translations:
  en:
    back-label: "Community"
    front-ribbon-label: "Community"
  de:
    back-label: "Gemeinschaft"
    front-ribbon-label: "Gemeinschaft"

properties:
  name:
    sample:
      en: "Seaborne"
      de: "Von den Wassern"

  blurb:
    slot: front-subtitle
    aliases: [summary-line, flavor, flavour, kurzbeschreibung, beschreibungszeile]
    description:
      en: "One line on the community, in italics under the name."
      de: "Eine Zeile über die Gemeinschaft, kursiv unter dem Namen."
    sample:
      en: "You lived on or near a large body of water."
      de: "Du hast auf oder an einem großen Gewässer gelebt."

  description:
    sample:
      en: "**Know the Tide:** You can sense the ebb and flow of life. When you roll with Fear, place a token on your community card. You can hold a number of tokens equal to your level. Before you make an action roll, you can spend any number of these tokens to gain a +1 bonus to the roll for each token spent. At the end of each session, clear all unspent tokens."
      de: "**Die Gezeiten kennen:** Du spürst Ebbe und Flut des Lebens. Wenn du mit Furcht würfelst, lege einen Marker auf deine Gemeinschaftskarte. Du kannst so viele Marker halten, wie deine Stufe beträgt. Bevor du einen Aktionswurf ausführst, kannst du beliebig viele dieser Marker einsetzen und erhältst für jeden einen Bonus von +1 auf den Wurf. Am Ende jeder Spielsitzung werden alle nicht eingesetzten Marker entfernt."
