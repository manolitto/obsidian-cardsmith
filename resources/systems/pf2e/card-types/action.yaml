# ── action ──────────────────────────────────────────────────────────
# A basic or skill action: the action cost beside the name, the skill
# and its required rank as a two-line badge, the category pills, the
# labelled lines, the effect, the four degrees of success, and an
# optional tinted box for examples or a named sub-rule.

front-template: templates/action-front.hbs
back-template: templates/back.hbs
stylesheet: styles/action.css

translations:
  de:
    back-label: "Aktion"
    front-frequency-label: "Häufigkeit"
    front-trigger-label: "Auslöser"
    front-requirements-label: "Anforderungen"
    front-critical-success-label: "Kritischer Erfolg"
    front-success-label: "Erfolg"
    front-failure-label: "Fehlschlag"
    front-critical-failure-label: "Kritischer Fehlschlag"
  # The Core Rulebook's action block: Frequency, Trigger, Requirements,
  # then the four degrees of success.
  en:
    back-label: "Action"
    front-frequency-label: "Frequency"
    front-trigger-label: "Trigger"
    front-requirements-label: "Requirements"
    front-critical-success-label: "Critical Success"
    front-success-label: "Success"
    front-failure-label: "Failure"
    front-critical-failure-label: "Critical Failure"

properties:
  image:
    sample: "[[Kantengriff.png]]"

  name:
    sample:
      de: "Kantengriff"
      en: "Ledge Catch"

  original-name:
    sample: "Ledge Catch"

  source:
    sample:
      de: "Hausregeln S. 8"
      en: "House Rules p. 8"

  actions:
    slot: front-title-glyph
    aliases: [aktionen, kosten, action-cost]
    description:
      de: "Aktionskosten, neben dem Namen als Symbol gedruckt: `1`, `2`, `3`, `r` (Reaktion), `f` (frei) oder das Symbol selbst."
      en: "Action cost, printed as a glyph beside the name: `1`, `2`, `3`, `r` (reaction), `f` (free) or the glyph itself."
    sample: "r"

  skill:
    slot: front-badge
    aliases: [fertigkeit, fertigkeiten]
    description:
      de: "Fertigkeit, zu der die Aktion gehört (z. B. `Akrobatik`, `Athletik`). Erscheint als Abzeichen rechts in der Kopfzeile; bei mehreren Fertigkeiten eine Liste, mit „/“ verbunden. Einfache Aktionen lassen das Feld weg."
      en: "Skill the action belongs to (e.g. `Akrobatik`, `Athletik`). Shown as the badge at the right of the header; a list for several skills, joined with \"/\". Basic actions omit it."
    sample:
      de: "Akrobatik"
      en: "Acrobatics"

  training:
    slot: front-badge-note
    aliases: [kompetenz, kompetenzgrad]
    description:
      de: "Erforderlicher Kompetenzgrad in der Fertigkeit (`ungeübt`, `geübt`, `Experte`, `Meister`, `Legende`), unter der Fertigkeit im Abzeichen."
      en: "Required proficiency rank in the skill (`ungeübt`, `geübt`, `Experte`, `Meister`, `Legende`), under the skill in the badge."
    sample:
      de: "geübt"
      en: "trained"

  categories:
    slot: front-traits
    aliases: [kategorien, merkmale]
    description:
      de: "Liste der Merkmale der Aktion (`Bewegung`, `Offensiv`, `Handhaben`, `Konzentration`, `Verdeckt`, `Erkundung`, …). Jeder Eintrag wird eine dunkelrote Pille unter dem Titel."
      en: "List of the action's traits (`Bewegung`, `Offensiv`, `Handhaben`, `Konzentration`, `Verdeckt`, `Erkundung`, …). Each entry becomes a dark-red pill under the title."
    sample:
      de: ["Bewegung"]
      en: ["Move"]

  frequency:
    slot: front-frequency
    aliases: [häufigkeit, haeufigkeit]
    description:
      de: "Häufigkeit (z. B. `1/Tag`, `einmal pro Stunde`)."
      en: "Frequency (e.g. `1/day`, `once per hour`)."
    sample: ""

  trigger:
    slot: front-trigger
    aliases: [auslöser, ausloeser]
    description:
      de: "Auslöser der Aktion, bei Reaktionen und freien Aktionen."
      en: "Trigger of the action, for reactions and free actions."
    sample:
      de: "Du stürzt an einem Rand in deiner Reichweite vorbei."
      en: "You fall past a ledge within your reach."

  requirements:
    slot: front-requirements
    aliases: [anforderungen, voraussetzungen]
    description:
      de: "Anforderungen für die Ausführung der Aktion."
      en: "Requirements for performing the action."
    sample:
      de: "Mindestens eine deiner Hände ist nicht gebunden."
      en: "At least one of your hands is not bound."

  description:
    slot: front-text
    aliases: [beschreibung, effekt, wirkung, text]
    description:
      de: "Wirkung der Aktion als Markdown — der Hauptteil der Karte."
      en: "The action's effect as markdown — the main body of the card."
    sample:
      de: "Im Fallen schnappst du nach dem Rand, an dem du vorbeistürzt. Lege einen Akrobatikwurf ab, meist gegen den Klettern-SG."
      en: "As you fall, you snatch at the rim you are dropping past. Attempt an Acrobatics check, usually against the Climb DC."

  critical-success:
    slot: front-critical-success
    aliases: [kritischer-erfolg, krit-erfolg]
    description:
      de: "Ergebnis bei kritischem Erfolg."
      en: "Outcome on a critical success."
    sample:
      de: "Du bekommst den Rand selbst mit vollen Händen zu fassen und ziehst dich hinauf."
      en: "You catch the ledge even with your hands full and haul yourself up onto it."

  success:
    slot: front-success
    aliases: [erfolg]
    description:
      de: "Ergebnis bei Erfolg."
      en: "Outcome on a success."
    sample:
      de: "Mit einer freien Hand bekommst du den Rand zu fassen und hängst daran; du nimmst keinen Fallschaden."
      en: "With a free hand you catch the ledge and hang from it; you take no falling damage."

  failure:
    slot: front-failure
    aliases: [fehlschlag, misserfolg]
    description:
      de: "Ergebnis bei Fehlschlag."
      en: "Outcome on a failure."
    sample: ""

  critical-failure:
    slot: front-critical-failure
    aliases: [kritischer-fehlschlag, krit-fehlschlag]
    description:
      de: "Ergebnis bei kritischem Fehlschlag."
      en: "Outcome on a critical failure."
    sample:
      de: "Du greifst ins Leere, stürzt weiter und landest liegend."
      en: "You clutch at nothing, keep falling and land prone."

  callout:
    slot: front-callout
    aliases: [beispiele, kasten, infokasten]
    description:
      de: |
        Kasten am Ende der Karte — eine Beispielliste oder eine benannte Nebenregel. Ein Objekt mit `title` (optional) und `body` (Markdown); ohne `title` steht der Text allein im getönten Kasten.

        ```yaml
        callout:
          title: "Beispiele"
          body: |
            - **Ungeübt** Leiter, steiler Hang
            - **Geübt** Takelage, Seil
        ```
      en: |
        Box at the end of the card — an example list or a named sub-rule. An object with `title` (optional) and `body` (markdown); without `title` the text stands alone in the tinted box.
    sample:
      de:
        title: "Am Rand hängen"
        body: "Solange du am Rand hängst, kannst du nur klettern oder loslassen."
      en:
        title: "Hanging On"
        body: "While you hang from the ledge, all you can do is climb or let go."
