# ── generic: the free card ─────────────────────────────────────────
# Open a note, write the text, done. The body is the note's markdown —
# paragraphs, sub-headings, lists, tables and embedded pictures included —
# under the header and over the footer every other card type has. The
# card knows the title, the two footer lines and a line under the back's
# banner. A deck cover, a house rule, a condition, a licence page.

front-template: templates/generic-front.hbs
back-template: templates/back.hbs
stylesheet: styles/generic.css
# One note, one physical card: a long text fills the back first and only
# then spawns further cards.
overflow-mode: back-then-cards

properties:
  image:
    sample: "[[Alchemie.jpg]]"

  name:
    sample:
      de: "Hausregel: Heldenpunkte"
      en: "House Rule: Hero Points"

  original-name:
    sample: "House Rule: Hero Points"

  source:
    sample:
      de: "Hausregeln S. 3"
      en: "House Rules p. 3"

  # The body, from three sources in this order — the first the note
  # actually sets wins: `content` in the block, a `## Vorderseite` or
  # `## Front` section, the note's own text before its first heading.
  # That text is the baseline's `body`, and it is the section's LAST
  # alias rather than a binding of its own: a bound `body` would sit
  # first among the place's properties, being inherited, and win over
  # the other two; as an alias of `content` it would be reached before
  # the section's English spelling.
  content:
    slot: front-body
    aliases: [text, inhalt, kartentext]
    description:
      de: "Kartentext als Markdown, direkt im cardsmith-Block. Hat Vorrang vor dem Notiztext. Für Tabellen und eingebettete Bilder den Notiztext benutzen."
      en: "Card body as markdown, inline in the cardsmith block. Takes precedence over the note's text. Use the note's text for tables and embedded pictures."
    sample:
      de: "Zu Beginn jeder Sitzung erhält jeder Charakter **1 Heldenpunkt**. Ein Heldenpunkt erlaubt einen Wurf zu wiederholen."
      en: "At the start of each session every character gains **1 Hero Point**. A Hero Point lets you reroll a check."

  vorderseite:
    slot: front-body
    aliases: [front, front-side, body]
    description:
      de: "Der Abschnitt unter einer `## Vorderseite`-Überschrift in der Notiz füllt die Karte, wenn der Block keinen `content` setzt. Voll gerendert – Tabellen, Überschriften, Listen und eingebettete Bilder inklusive."
      en: "The section under a `## Vorderseite` or `## Front` heading in the note fills the card when the block sets no `content`. Fully rendered — tables, headings, lists and embedded pictures included."

  back-subtitle:
    slot: back-banner-subtitle
    aliases: [untertitel, rückseiten-untertitel, subtitle]
    description:
      de: "Zweite Zeile unter dem Banner der Rückseite, in kleinerer Schrift. Ohne Angabe entfällt sie."
      en: "Second line under the back's banner, in smaller type. Omitted when empty."
    sample:
      de: "Hausregeln"
      en: "House rules"
