# ── item ────────────────────────────────────────────────────────────
# Equipment and magic items: the category and rarity line, the
# statistics a weapon or an armour has, the text; the picture on the
# back. Forest green.

front-template: templates/item-front.hbs
back-template: templates/back.hbs

translations:
  en:
    back-label: "Item"
    attunement: "Requires Attunement"
    front-damage-label: "Damage"
    front-properties-label: "Properties"
    front-mastery-label: "Mastery"
    front-ac-label: "Armor Class"
    front-strength-label: "Strength"
    front-stealth-label: "Stealth"
    front-weight-label: "Weight"
    front-cost-label: "Cost"
  de:
    back-label: "Gegenstand"
    attunement: "erfordert Einstimmung"
    front-damage-label: "Schaden"
    front-properties-label: "Eigenschaften"
    front-mastery-label: "Meisterschaft"
    front-ac-label: "Rüstungsklasse"
    front-strength-label: "Stärke"
    front-stealth-label: "Heimlichkeit"
    front-weight-label: "Gewicht"
    front-cost-label: "Kosten"

properties:
  name:
    sample:
      en: "Lantern of Ash"
      de: "Aschelaterne"

  category:
    slot: [front-category, back-heading]
    aliases: [item-type, kategorie, gegenstandsart]
    description:
      en: "The category, with the base item in parentheses — `Wondrous Item`, `Weapon (Longsword)`, `Armor (Shield)`. Also the label on the back, unless the note sets `back-label`."
      de: "Die Kategorie, der Grundgegenstand in Klammern — `Wundersamer Gegenstand`, `Waffe (Langschwert)`, `Rüstung (Schild)`. Auch die Beschriftung der Rückseite, wenn die Notiz kein `back-label` setzt."
    sample:
      en: "Wondrous Item"
      de: "Wundersamer Gegenstand"

  rarity:
    slot: front-rarity
    aliases: [seltenheit]
    description:
      en: "The rarity — `Common`, `Uncommon`, `Rare`, `Very Rare`, `Legendary`, `Artifact` — after the category."
      de: "Die Seltenheit — `gewöhnlich`, `ungewöhnlich`, `selten`, `sehr selten`, `legendär`, `Artefakt` — nach der Kategorie."
    sample:
      en: "Uncommon"
      de: "ungewöhnlich"

  attunement:
    slot: front-attunement
    aliases: [requires-attunement, einstimmung]
    description:
      en: "`true` for an item that requires attunement, or who may attune — `by a Wizard` — printed after “Requires Attunement”."
      de: "`true` für einen Gegenstand, der Einstimmung erfordert, oder wer sich einstimmen kann — `durch einen Magier` — nach „erfordert Einstimmung“."
    sample: true

  weight:
    slot: front-weight
    aliases: [gewicht]
    description:
      en: "The weight — `3 lb.`."
      de: "Das Gewicht — `1,5 kg`."
    sample:
      en: "2 lb."
      de: "1 kg"

  cost:
    slot: front-cost
    aliases: [price, preis, kosten]
    description:
      en: "The cost — `15 GP`."
      de: "Die Kosten — `15 GM`."
    sample:
      en: "400 GP"
      de: "400 GM"

  damage:
    slot: front-damage
    aliases: [schaden]
    description:
      en: "A weapon's damage — `1d8 Slashing`."
      de: "Der Schaden einer Waffe — `1W8 Hieb`."

  properties:
    slot: front-properties
    aliases: [weapon-properties, waffeneigenschaften]
    description:
      en: "A weapon's properties, comma-separated — `Versatile (1d10)`."
      de: "Die Eigenschaften einer Waffe, durch Komma getrennt — `Vielseitig (1W10)`."

  mastery:
    slot: front-mastery
    aliases: [weapon-mastery, meisterschaft, waffenmeisterschaft]
    description:
      en: "A weapon's mastery property — `Sap`."
      de: "Die Meisterschaftseigenschaft einer Waffe — `Auslaugen`."

  ac:
    slot: front-ac
    aliases: [armor-class, armorclass, rüstungsklasse, ruestungsklasse, rk]
    description:
      en: "An armour's Armor Class — `14 + Dex modifier (max 2)`, `+2`."
      de: "Die Rüstungsklasse einer Rüstung — `14 + GES-Modifikator (max. 2)`, `+2`."

  strength:
    slot: front-strength
    aliases: [strength-requirement, stärke, staerke]
    description:
      en: "The Strength an armour needs — `Str 13`."
      de: "Die Stärke, die eine Rüstung erfordert — `Stä 13`."

  stealth:
    slot: front-stealth
    aliases: [heimlichkeit]
    description:
      en: "What an armour does to Stealth — `Disadvantage`."
      de: "Was eine Rüstung mit Heimlichkeit macht — `Nachteil`."

  description:
    slot: front-description
    description:
      en: "What the item is and does — markdown, paragraphs and lists."
      de: "Was der Gegenstand ist und bewirkt — Markdown, Absätze und Listen."
    sample:
      en: "While lit, this brass lantern sheds dim grey light in a 20-foot radius. Invisible creatures in that light leave faint trails of ash."
      de: "Solange sie brennt, verbreitet diese Messinglaterne in einem Radius von sechs Metern dämmriges graues Licht. Unsichtbare Kreaturen in diesem Licht hinterlassen feine Aschespuren."

  body:
    slot: front-description

  # The boxes every card may print, shown on the sample: a flask of oil
  # keeps a lantern lit for six hours.
  tracker:
    sample:
      en: { count: 6, label: "Hours of oil" }
      de: { count: 6, label: "Stunden Öl" }

  image:
    slot: back-image
    aliases: [bild]
    description:
      en: "The item's picture — a wikilink to a picture in the vault — on the back. Without one the back shows a d20."
      de: "Das Bild des Gegenstands — ein Wikilink auf ein Bild im Vault — auf der Rückseite. Ohne Bild zeigt die Rückseite einen W20."
